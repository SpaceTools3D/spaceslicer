name: Unit Tests (rerun from a build)

# SpaceSlicer: run the unit tests again from the test package of an earlier "Build all" run,
# without building again, and print the failing tests as annotations on this run.
on:
  # Starts when .github/test-rerun.json changes on a branch: {"run-id": "...", "artifact": "...", "os": "ubuntu-24.04"}.
  # (A hand-started workflow has to exist on the default branch; this one can live on a work branch.)
  push:
    paths:
      - '.github/test-rerun.json'

permissions:
  contents: read
  actions: read

jobs:
  read:
    runs-on: ubuntu-24.04
    outputs:
      cfg: ${{ steps.cfg.outputs.cfg }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: cfg
        run: echo "cfg=$(jq -c . .github/test-rerun.json)" >> "$GITHUB_OUTPUT"
  unit_tests:
    name: Unit Tests (rerun)
    runs-on: ${{ fromJSON(needs.read.outputs.cfg).os || 'ubuntu-24.04' }}
    needs: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            scripts
            tests
            resources
      - name: Apt-Install Dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install-deps
      - name: Restore Test Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ fromJSON(needs.read.outputs.cfg).artifact }}
          run-id: ${{ fromJSON(needs.read.outputs.cfg)['run-id'] }}
          github-token: ${{ github.token }}
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true
      - name: Unpackage and Run Unit Tests
        timeout-minutes: 20
        shell: bash
        run: |
          tar -xvf build_tests.tar > /dev/null
          scripts/run_unit_tests.sh build/tests Release
      - name: Failed tests as annotations
        if: ${{ failure() }}
        shell: bash
        run: python3 scripts/ctest_failure_annotations.py ctest_results.xml || true
